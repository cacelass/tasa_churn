[project]
name = "retainml"
version = "0.2.0"
description = "Supervised ML system that predicts customer churn probability from demographic, usage and interaction data."
authors = [
    { name = "Alejandro Cancelas Chapela" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core runtime dependencies (everything needed to train and predict)
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "plotly",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    "joblib",
    "pyjanitor",
    "missingno",
    "python-dotenv",
]

[project.optional-dependencies]
# Install with: pip install -e ".[dev]"
dev = [
    "black",
    "pylint",
    "pytest>=9.0",
    "invoke",
    "nbdime",
]
# Install with: pip install -e ".[notebooks]"
notebooks = [
    "jupyter",
    "jupyterlab",
    "statsmodels",
]

[tool.setuptools.packages.find]
# Automatically discover the tasa_churn package and sub-packages
where = ["."]
include = ["tasa_churn*"]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]